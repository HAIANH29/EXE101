services:
  postgres:
    image: postgres:16-alpine
    container_name: stylelock-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stylelock}
      POSTGRES_USER: ${POSTGRES_USER:-stylelock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stylelock}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - stylelock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stylelock} -d ${POSTGRES_DB:-stylelock}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  stylelock-postgres-data:
