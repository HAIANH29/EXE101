spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stylelock}
    username: ${DB_USERNAME:stylelock}
    password: ${DB_PASSWORD:stylelock}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000

  jpa:
    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration,classpath:db/dev-migration

app:
  demo:
    enabled: ${STYLELOCK_DEMO_ENABLED:true}
    owner-email: ${STYLELOCK_DEMO_OWNER_EMAIL:demo.owner@stylelock.local}
    owner-password: ${STYLELOCK_DEMO_OWNER_PASSWORD:DemoOwner123!}
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-this-to-a-random-64-character-value}

logging:
  level:
    root: INFO
    be.exe: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: DEBUG
