spring:
  application:
    name: salon-backend

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub


server:
  port: ${SERVER_PORT:8080}


app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:${JWT_ACCESS_TOKEN_EXPIRATION:900000}}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:${JWT_REFRESH_TOKEN_EXPIRATION:604800000}}
    issuer: salon-backend

  sepay:
    base-url: ${SEPAY_BASE_URL:https://my.sepay.vn/userapi}
    api-token: ${SEPAY_API_TOKEN:${SEPAY_API_KEY:}}
    account-number: ${SEPAY_ACCOUNT_NUMBER:}
    bank-code: ${SEPAY_BANK_CODE:}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}

  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-ms: ${OPENAI_TIMEOUT_MS:30000}

  oauth2:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    redirect-uri: ${OAUTH2_REDIRECT_URI:${GOOGLE_REDIRECT_URI:http://localhost:8081/oauth2/redirect}}


springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    enabled: true
