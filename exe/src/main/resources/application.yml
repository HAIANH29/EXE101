spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: salon-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # Timeout để request/thread không treo vô hạn khi cổng SMTP bị chặn (vd. Render free tier)
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: ${SERVER_PORT:8080}

app:
  billing:
    booking-fee: ${STYLELOCK_BOOKING_FEE:5000}
    salon-pro-monthly-fee: ${STYLELOCK_SALON_PRO_MONTHLY_FEE:150000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8082,http://localhost:8081,http://localhost:19006,http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:${JWT_ACCESS_TOKEN_EXPIRATION:900000}}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}}
    issuer: salon-backend

  sepay:
    base-url: ${SEPAY_BASE_URL:https://my.sepay.vn/userapi}
    api-token: ${SEPAY_API_TOKEN:${SEPAY_API_KEY:}}
    account-number: ${SEPAY_ACCOUNT_NUMBER:}
    bank-code: ${SEPAY_BANK_CODE:}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}

  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-ms: ${OPENAI_TIMEOUT_MS:30000}

  oauth2:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    redirect-uri: ${OAUTH2_REDIRECT_URI:${GOOGLE_REDIRECT_URI:http://localhost:8081/oauth2/redirect}}

  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
    # PHẢI đặt thành địa chỉ thật của customer app khi deploy, vd. https://<ten-mien-app>/reset-password
    frontend-reset-url: ${APP_FRONTEND_RESET_URL:http://localhost:8081/reset-password}

  mail:
    # smtp (Brevo SMTP cổng 587) | brevo (Brevo HTTP API cổng 443)
    provider: ${MAIL_PROVIDER:smtp}
    enabled: ${MAIL_ENABLED:${PASSWORD_RESET_MAIL_ENABLED:false}}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:StyleLock}
    # HTTP API không hỗ trợ ảnh inline CID -> dùng URL công khai cho logo
    logo-url: ${MAIL_LOGO_URL:${APP_PUBLIC_BASE_URL:http://localhost:8080}/email/stylelock-logo-transparent.png}
    http-timeout-ms: ${MAIL_HTTP_TIMEOUT_MS:10000}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
    async:
      core-pool-size: ${MAIL_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${MAIL_ASYNC_MAX_POOL_SIZE:4}
      queue-capacity: ${MAIL_ASYNC_QUEUE_CAPACITY:200}

  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-sends-per-hour: ${OTP_MAX_SENDS_PER_HOUR:5}
    max-verify-attempts: ${OTP_MAX_VERIFY_ATTEMPTS:5}

  upload:
    root-dir: ${APP_UPLOAD_ROOT_DIR:uploads}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
    avatar-max-size-bytes: ${APP_AVATAR_MAX_SIZE_BYTES:5242880}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  ai:
    # Backend gọi thẳng Replicate (Style Your Hair: cjwbw/style-your-hair), không còn service Python trung gian.
    replicate:
      api-token: ${REPLICATE_API_TOKEN:}
      hair-model: ${REPLICATE_HAIR_MODEL:cjwbw/style-your-hair}

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    enabled: true
